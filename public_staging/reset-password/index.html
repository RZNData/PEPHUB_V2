<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definição de Senha — Regional Norte | Pephub</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1c2430; --ink2:#5b6675; --ink3:#8b95a3;
  --line:#dfe3e8; --line2:#eceef1; --nav:#1b2430; --nav2:#27323f;
  --red:#c0392b; --amber:#c98a15; --green:#2f7d5d; --blue:#2a5d8f; --purple:#6b4b8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd-bar{background:linear-gradient(90deg,#8a0f18 0%,#c0191f 26%,#e23a1e 50%,#f47a1f 74%,#f9b233 100%);
  display:flex;align-items:center;gap:14px;padding:14px 26px}
.hd-ico{width:42px;height:42px;min-width:42px;border-radius:50%;border:2px solid rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center}
.hd-bar h1{margin:0;color:#fff;font-size:24px;font-weight:400;letter-spacing:-.4px;line-height:1.1;
  display:flex;align-items:baseline;gap:9px}
.hd-bar h1 b{font-weight:800;letter-spacing:-1px}
.hd-bar h1 span{font-weight:300;font-size:20px;color:rgba(255,255,255,.93)}
.hd-sub{background:var(--nav);color:#aab4c0;font-size:11.5px;padding:7px 26px;display:flex;align-items:center;gap:10px}
.hd-sub a{color:#f9b233;text-decoration:none;font-weight:600}
.hd-sub a:hover{color:#fff;text-decoration:underline}

.main-container{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:4px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.04);overflow:hidden}
.auth-header{padding:24px 24px 16px;border-bottom:1px solid var(--line2);text-align:center}
.auth-header h2{margin:0 0 6px;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.auth-header p{margin:0;color:var(--ink2);font-size:12px;line-height:1.5}

.auth-body{padding:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-bottom:6px}
.form-group input{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 12px;font:13px "Segoe UI",Arial;color:var(--ink);background:#fcfcfd;transition:border-color .15s}
.form-group input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(42,93,143,.12)}

.btn-submit{width:100%;background:var(--nav);color:#fff;border:none;border-radius:3px;padding:11px;font:600 13px "Segoe UI",Arial;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover{background:var(--nav2)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}

.alert{padding:10px 14px;border-radius:3px;font-size:12px;margin-bottom:16px;display:none;line-height:1.45}
.alert.error{background:#fdece9;border:1px solid #f6c8c2;color:#9b1c1c;display:block}
.alert.warning{background:#fdf3e2;border:1px solid #f0dcb4;color:#8a5d06;display:block}
.alert.success{background:#eaf2ec;border:1px solid #c9dfd2;color:#235c44;display:block}

.auth-footer{padding:14px 24px;background:#fafbfc;border-top:1px solid var(--line2);text-align:center;font-size:12px;color:var(--ink2)}
.auth-footer a{color:var(--blue);text-decoration:none;font-weight:700}
.auth-footer a:hover{text-decoration:underline}

.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="hd-bar">
    <div class="hd-ico">
      <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-width="2.6"/>
        <path d="M31.5 16.5 L26.5 26.5 L16.5 31.5 L21.5 21.5 Z" fill="#fff"/>
      </svg>
    </div>
    <h1><b>Pephub</b> <span>Portal de Churn & Qualidade · Regional Norte</span></h1>
  </div>
  <div class="hd-sub">
    <a href="/login/">‹ Voltar ao Login</a>
    <span style="color:#5b6675">•</span>
    <span>Definição de Senha</span>
  </div>
</header>

<div class="main-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2 id="cardTitle">Definir Nova Senha</h2>
      <p id="cardDesc">Digite e confirme a sua nova senha corporativa (mínimo de 6 dígitos).</p>
    </div>

    <div class="auth-body">
      <div id="alertBox" class="alert"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="password">Nova Senha</label>
          <input type="password" id="password" name="password" minlength="6" placeholder="Mínimo 6 dígitos" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm_password">Repetir Nova Senha</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="6" placeholder="Confirme a nova senha" required autocomplete="new-password">
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <div id="btnSpinner" class="spinner"></div>
          <span id="btnText">Salvar Nova Senha</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="/login/">Ir para o Login</a>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const isForced = params.get('forced') === '1';

if (isForced) {
  document.getElementById('cardTitle').textContent = 'Definição de Senha Obrigatória';
  document.getElementById('cardDesc').textContent = 'Você efetuou login com uma senha provisória de uso único. Defina sua nova senha pessoal para continuar.';
  showAlert('Por segurança, cadastre sua senha corporativa definitiva.', 'warning');
} else if (!token) {
  showAlert('Token de recuperação ausente ou inválido. Solicite um novo link.', 'error');
  document.getElementById('resetForm').style.display = 'none';
}

function showAlert(text, type='error') {
  const box = document.getElementById('alertBox');
  box.className = 'alert ' + type;
  box.textContent = text;
  box.style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  const btn = document.getElementById('btnSubmit');
  const sp = document.getElementById('btnSpinner');
  const txt = document.getElementById('btnText');

  if (password.length < 6) {
    showAlert('A nova senha deve ter no mínimo 6 dígitos.');
    return;
  }

  if (password !== confirm) {
    showAlert('As senhas digitadas não coincidem.');
    return;
  }

  btn.disabled = true;
  sp.style.display = 'inline-block';
  txt.textContent = 'Salvando…';

  try {
    let res;
    if (isForced) {
      // Troca autenticada via sessão
      res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_password: password })
      });
    } else {
      // Redefinição via token de e-mail
      res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: password })
      });
    }

    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Erro ao processar alteração de senha.');
      btn.disabled = false;
      sp.style.display = 'none';
      txt.textContent = 'Salvar Nova Senha';
      return;
    }

    showAlert('Senha definida com sucesso. Redirecionando para o portal…', 'success');
    setTimeout(() => {
      window.location.href = isForced ? '/' : '/login/?msg=reset_done';
    }, 1200);

  } catch (err) {
    showAlert('Erro de conexão com o servidor. Tente novamente.');
    btn.disabled = false;
    sp.style.display = 'none';
    txt.textContent = 'Salvar Nova Senha';
  }
});
</script>

</body>
</html>
