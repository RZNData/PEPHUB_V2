version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution_api_pephub
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - pephub_network

networks:
  pephub_network:
    driver: bridge

volumes:
  evolution_instances:
  evolution_store:
