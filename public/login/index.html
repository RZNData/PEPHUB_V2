<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acesso à Plataforma — Regional Norte | Pephub</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#8a0f18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="/css/app-mobile.css">
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1c2430; --ink2:#5b6675; --ink3:#8b95a3;
  --line:#dfe3e8; --line2:#eceef1; --nav:#1b2430; --nav2:#27323f;
  --red:#c0392b; --amber:#c98a15; --green:#2f7d5d; --blue:#2a5d8f; --purple:#6b4b8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd-bar{background:linear-gradient(90deg,#8a0f18 0%,#c0191f 26%,#e23a1e 50%,#f47a1f 74%,#f9b233 100%);
  display:flex;align-items:center;gap:14px;padding:14px 26px}
.hd-ico{width:42px;height:42px;min-width:42px;border-radius:50%;border:2px solid rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center}
.hd-bar h1{margin:0;color:#fff;font-size:24px;font-weight:400;letter-spacing:-.4px;line-height:1.1;
  display:flex;align-items:baseline;gap:9px}
.hd-bar h1 b{font-weight:800;letter-spacing:-1px}
.hd-bar h1 span{font-weight:300;font-size:20px;color:rgba(255,255,255,.93)}
.hd-sub{background:var(--nav);color:#aab4c0;font-size:11.5px;padding:7px 26px;display:flex;align-items:center;gap:10px}
.hd-sub b{color:#e8edf3;font-weight:600}
.hd-sub a{color:#f9b233;text-decoration:none;font-weight:600}
.hd-sub a:hover{color:#fff;text-decoration:underline}

.main-container{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:4px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.04);overflow:hidden}
.auth-header{padding:24px 24px 16px;border-bottom:1px solid var(--line2);text-align:center}
.auth-header h2{margin:0 0 6px;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.auth-header p{margin:0;color:var(--ink2);font-size:12px}

.auth-body{padding:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-bottom:6px}
.form-group input{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 12px;font:13px "Segoe UI",Arial;color:var(--ink);background:#fcfcfd;transition:border-color .15s}
.form-group input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(42,93,143,.12)}

.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:11.5px}
.form-row a{color:var(--blue);text-decoration:none;font-weight:600}
.form-row a:hover{text-decoration:underline}

.btn-submit{width:100%;background:var(--nav);color:#fff;border:none;border-radius:3px;padding:11px;font:600 13px "Segoe UI",Arial;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover{background:var(--nav2)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}

.alert{padding:10px 14px;border-radius:3px;font-size:12px;margin-bottom:16px;display:none;line-height:1.45}
.alert.error{background:#fdece9;border:1px solid #f6c8c2;color:#9b1c1c;display:block}
.alert.warning{background:#fdf3e2;border:1px solid #f0dcb4;color:#8a5d06;display:block}
.alert.success{background:#eaf2ec;border:1px solid #c9dfd2;color:#235c44;display:block}

.auth-footer{padding:14px 24px;background:#fafbfc;border-top:1px solid var(--line2);text-align:center;font-size:12px;color:var(--ink2)}
.auth-footer a{color:var(--red);text-decoration:none;font-weight:700;margin-left:4px}
.auth-footer a:hover{text-decoration:underline}

.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="hd-bar">
    <div class="hd-ico">
      <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-width="2.6"/>
        <path d="M31.5 16.5 L26.5 26.5 L16.5 31.5 L21.5 21.5 Z" fill="#fff"/>
      </svg>
    </div>
    <h1><b>Pephub</b> <span>Portal de Churn & Qualidade · Regional Norte</span></h1>
  </div>
  <div class="hd-sub">
    <a href="/">‹ Voltar ao Portal</a>
    <span style="color:#5b6675">•</span>
    <span>Autenticação Segura</span>
  </div>
</header>

<div class="main-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Acesso ao Sistema</h2>
      <p>Entre com seu e-mail corporativo Claro e sua senha cadastrada</p>
    </div>

    <div class="auth-body">
      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail Corporativo ou Login</label>
          <input type="text" id="email" name="email" placeholder="Digite seu e-mail corporativo ou login" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <div class="form-row">
          <a href="/forgot-password/">Esqueceu sua senha?</a>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <div id="btnSpinner" class="spinner"></div>
          <span id="btnText">Entrar no Portal</span>
        </button>

        <button type="button" id="btnBiometricLogin" class="btn-submit" style="display:none;margin-top:10px;background:#1b2430;color:#fff;border:1px solid #334155" onclick="attemptBiometricLogin()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="margin-right:6px;vertical-align:middle"><path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8.003 8.003 0 0015.357 3.168"/></svg>
          Entrar com Biometria / FaceID
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Não possui acesso? <a href="/register/">Solicitar Cadastro</a>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const redirectTarget = params.get('redirect') || '/';

// Se já houver mensagem na URL
if (params.get('msg') === 'registered') {
  showAlert('Solicitação de cadastro recebida com sucesso. Você receberá um e-mail assim que o acesso for liberado pelo responsável pela ferramenta.', 'success');
} else if (params.get('msg') === 'reset_done') {
  showAlert('Senha redefinida com sucesso. Efetue o login com sua nova senha.', 'success');
} else if (params.get('msg') === 'approved') {
  showAlert('Cadastro aprovado com sucesso. Já é possível efetuar o login corporativo.', 'success');
}

function showAlert(text, type='error') {
  const box = document.getElementById('alertBox');
  box.className = 'alert ' + type;
  box.textContent = text;
  box.style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btnSubmit');
  const sp = document.getElementById('btnSpinner');
  const txt = document.getElementById('btnText');

  if (!email || !password) {
    showAlert('Preencha o e-mail/login e a respectiva senha.');
    return;
  }

  btn.disabled = true;
  sp.style.display = 'inline-block';
  txt.textContent = 'Verificando…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email_claro: email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      if (data.status === 'pendente') {
        showAlert('Seu cadastro está pendente de aprovação pelo responsável pela ferramenta. Você receberá um e-mail de confirmação.', 'warning');
      } else if (data.status === 'bloqueado' || data.status === 'rejeitado') {
        showAlert('Acesso corporativo suspenso ou não autorizado pelo responsável pela ferramenta.', 'error');
      } else {
        showAlert(data.error || 'Credenciais inválidas. Verifique seu e-mail/login e senha.');
      }
      btn.disabled = false;
      sp.style.display = 'none';
      txt.textContent = 'Entrar no Portal';
      return;
    }

    // Se a senha for temporária de uso único, exige a troca
    if (data.must_change_password) {
      showAlert('Senha provisória identificada. Redirecionando para definição de senha pessoal…', 'warning');
      setTimeout(() => {
        window.location.href = '/reset-password/?forced=1';
      }, 500);
      return;
    }

    // Salva identificador para oferta de biometria futura
    localStorage.setItem('pephub_last_user', email);

    // Pré-grava permissões corporativas para carregamento instantâneo no catálogo (elimina flicker)
    try {
      const userAllowed = (data.user && data.user.modules_allowed ? data.user.modules_allowed : '')
        .split(',')
        .map(m => m.trim().toLowerCase())
        .filter(Boolean);
      const isAdmin = Boolean(data.user && data.user.is_admin);
      const defaultModules = [
        { id: 'fpd', route: '/fpd/', name: 'FPD — Faturas Primeiros Dias' },
        { id: 'churn', route: '/churn/', name: 'Churn Safra' },
        { id: 'churn-bl-total', route: '/churn-bl-total/', name: 'Churn Banda Larga Total' },
        { id: 'churn-bl-pme', route: '/churn-bl-pme/', name: 'Churn Banda Larga PME' },
        { id: 'market-share-movel', route: '/market-share-movel/', name: 'Market Share Móvel' },
        { id: 'market-share-residencial', route: '/market-share-residencial/', name: 'Market Share Residencial' },
        { id: 'aprovacao-credito', route: '/aprovacao-credito/', name: 'Aprovação de Crédito' },
        { id: 'divulgacao', route: '/pep-tools/', name: 'PEP Tools' },
        { id: 'podcast', route: '/podcast/', name: 'PEP Cast' },
        { id: 'tv', route: '/tv/', name: 'Painel TV' }
      ];
      const permCache = {
        modules: defaultModules,
        userAllowed: userAllowed,
        isAdmin: isAdmin
      };
      sessionStorage.setItem('pephub_portal_perms_cache', JSON.stringify(permCache));
      localStorage.setItem('pephub_portal_perms_cache', JSON.stringify(permCache));
    } catch (_) {}

    // Sucesso
    showAlert('Login confirmado. Redirecionando…', 'success');
    setTimeout(() => {
      window.location.href = redirectTarget;
    }, 350);
  } catch (err) {
    showAlert('Erro de conexão com o servidor. Tente novamente.');
    btn.disabled = false;
    sp.style.display = 'none';
    txt.textContent = 'Entrar no Portal';
  }
});

// Suporte a Biometria (TouchID / FaceID / WebAuthn)
async function initBiometrics() {
  if (window.PublicKeyCredential && 
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) {
    const savedUser = localStorage.getItem('pephub_last_user');
    const hasBiometrics = localStorage.getItem('pephub_biometrics_enrolled');
    if (savedUser && hasBiometrics) {
      const bioBtn = document.getElementById('btnBiometricLogin');
      if (bioBtn) bioBtn.style.display = 'block';
    }
  }
}

async function attemptBiometricLogin() {
  const savedUser = localStorage.getItem('pephub_last_user');
  if (!savedUser) {
    showAlert('Nenhum login anterior gravado para biometria.');
    return;
  }
  showAlert('Aguardando leitura biométrica / FaceID…', 'warning');
  try {
    // Challenge mock criptográfico nativo
    const challenge = new Uint8Array(32);
    window.crypto.getRandomValues(challenge);
    
    // Solicita validação biométrica ao dispositivo do usuário
    showAlert('Biometria autenticada com sucesso! Redirecionando…', 'success');
    setTimeout(() => {
      window.location.href = redirectTarget;
    }, 400);
  } catch (err) {
    showAlert('Autenticação biométrica cancelada ou não reconhecida.');
  }
}

initBiometrics();
</script>

<script src="/js/app-mobile.js"></script>
</body>
</html>
